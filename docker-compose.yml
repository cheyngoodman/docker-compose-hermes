# Hermes Agent + WebUI (separate containers) + Caddy applets
#
# Services:
#   hermes-agent  — gateway API + dashboard (gateway run, HERMES_DASHBOARD=1)
#   hermes-webui  — browser chat interface (ghcr.io/nesquena/hermes-webui)
#   applets       — static file server for /opt/data/applets/
#
# Disable the WebUI: comment out the entire hermes-webui service block.
# That's it — no env var toggle, no init script to touch.
#
# No Ollama — local inference didn't work, freed 6GB RAM.
#
# QUICK START:
#   1. cp example.env .env && edit .env (set passwords)
#   2. docker compose up -d
#   3. Gateway :8642, Dashboard :9119, WebUI :8787, Applets :80

services:
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    command: gateway run
    shm_size: 1g
    ports:
      - "8642:8642"      # gateway API
      - "9119:9119"      # dashboard
    volumes:
      # ── Agent state (bind mount — no migration, same path as v1) ──
      # Contains: config.yaml, state.db, .env, sessions/, skills/,
      #           memory_store.db, projects.db, workspace/
      # Same host path as always: ./data = /opt/data/workspace/.../docker-compose-hermes/data/
      - ./data:/opt/data

      # ── Agent Python source (named volume — initialized from image) ──
      # Shared read-only with the WebUI container so it can install matching
      # agent deps at startup. Recreate after agent image upgrades.
      - hermes-agent-src:/opt/hermes
    environment:
      - TZ=America/Los_Angeles
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_USERNAME:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_PASSWORD}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9119/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    networks:
      - hermes-net

  # ── Comment out this entire block to disable the WebUI ──────────
  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui:latest
    container_name: hermes-webui
    depends_on:
      hermes-agent:
        condition: service_healthy
    ports:
      - "8787:8787"
    volumes:
      # ── Agent state (same bind mount as hermes-agent, different path) ──
      # Both containers read/write the same ./data/ host directory.
      # Agent sees it at /opt/data/; WebUI sees it at /home/hermeswebui/.hermes/
      - ./data:/home/hermeswebui/.hermes

      # ── Agent Python source (shared named volume, read-only) ──
      # The WebUI's docker_init.bash installs agent deps from this at startup.
      # Read-only because the WebUI only needs to read it.
      - hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent:ro
    environment:
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      - HERMES_WEBUI_DEFAULT_WORKSPACE=/home/hermeswebui/.hermes/workspace
      - HERMES_API_URL=http://hermes-agent:8642
      - HERMES_WEBUI_PASSWORD=${HERMES_WEBUI_PASSWORD}
      - WANTED_UID=${HERMES_UID:-1000}
      - WANTED_GID=${HERMES_GID:-1000}
    restart: unless-stopped
    networks:
      - hermes-net
  # ── End WebUI block ─────────────────────────────────────────────

  applets:
    image: caddy:2-alpine
    container_name: hermes-applets
    command: caddy file-server --root /srv --browse
    ports:
      - "80:80"
    volumes:
      # ── Applets (bind mount, read-only) ──
      # Static HTML files served at http://<host>/<slug>/
      - ./data/applets:/srv:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - hermes-net

networks:
  hermes-net:
    driver: bridge

volumes:
  # Agent Python source — initialized from nousresearch/hermes-agent image
  # on first `docker compose up`. Shared read-only with WebUI container.
  #
  # After pulling a new agent image:
  #   docker compose down
  #   docker volume rm docker-compose-hermes_hermes-agent-src
  #   docker compose up -d
  #
  # NOT an NFS candidate — ephemeral, recreated on upgrades.
  hermes-agent-src: